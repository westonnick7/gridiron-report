name: Scheduled Data Pull

on:
  schedule:
    # Twice daily so schedules stay correct: early-morning US (10:00 UTC)
    # and midday US (18:00 UTC) to catch same-day schedule changes,
    # postponements, and freshly-finished game boxes.
    - cron: "0 10 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  pull-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # NFL uses nfl_data_py, which pins pandas<2.0 (-> numpy 1.x). The
      # sportsdataverse sports need modern pandas/numpy + pyarrow>=NumPy2 and
      # an xgboost old enough (<3.1) to load sportsdataverse's bundled model.
      # These two worlds are mutually incompatible, so each gets its own venv.
      - name: Run data pulls
        run: |
          set +e
          FAIL=0

          echo "::group::Install NFL env"
          python -m venv /tmp/nflenv
          /tmp/nflenv/bin/pip install -q --upgrade pip
          /tmp/nflenv/bin/pip install -q nfl_data_py pandas numpy
          echo "::endgroup::"
          echo "== NFL pull =="
          /tmp/nflenv/bin/python scripts/pull_nfl_data.py || { echo "::warning::NFL pull failed"; FAIL=1; }

          echo "::group::Install sportsdataverse env"
          python -m venv /tmp/sdvenv
          /tmp/sdvenv/bin/pip install -q --upgrade pip
          /tmp/sdvenv/bin/pip install -q sportsdataverse "pandas>=2.1" "numpy>=2.0" "xgboost<3.1" pyarrow polars
          echo "::endgroup::"
          for s in nba nhl cfb ncaam; do
            echo "== ${s} pull =="
            /tmp/sdvenv/bin/python scripts/pull_${s}_data.py || { echo "::warning::${s} pull failed"; FAIL=1; }
          done

          echo "PULL_FAIL=$FAIL" >> "$GITHUB_ENV"

      - name: Commit updated data if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/gridiron_report_data.json data/nba_data.json data/nhl_data.json data/cfb_data.json data/ncaam_data.json
          git diff --staged --quiet || git commit -m "Data refresh"
          git push

      - name: Flag any pull failures
        if: env.PULL_FAIL == '1'
        run: |
          echo "::error::One or more data pulls failed (see warnings above). Successful sports were still committed."
          exit 1
